services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - mold-web
    networks:
      - mold-net
    user: root # Need root for binding to privileged ports and cert access

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    networks:
      - mold-net

  mold-web:
    image: mold-web:latest
    user: nonroot
    ports:
      - "8880:8080"
    networks:
      - mold-net
    environment:
      RUST_LOG: INFO
      DATABASE_URL: "postgresql://mold-postgres-local/"
    hostname: mold-web-local

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
    networks:
      - mold-net
    ports:
      - "5432:5432"
    hostname: mold-postgres-local
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  mold-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local
