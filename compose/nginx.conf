user  nginx;
worker_processes  2;

events {
    worker_connections  1024;
}

http {
    sendfile  on;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/html
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Enable Brotli compression (if available)
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/html
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    upstream mold-web {
        server mold-web:8080;  # Using the internal port of the mold-web service
    }

    server {
        listen 80;
        listen [::]:80;
        server_name mold.world;

        # Handle Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name mold.world;

        # Enable HTTP/3 (QUIC)
        listen 443 quic reuseport;
        listen [::]:443 quic reuseport;

        # Add HTTP/3 headers
        add_header Alt-Svc 'h3=":443"; ma=86400, h3-29=":443"; ma=86400' always;

        # Let's Encrypt SSL certificates
        ssl_certificate /etc/letsencrypt/live/mold.world/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mold.world/privkey.pem;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Enable QUIC/HTTP3 specific settings
        ssl_early_data on;
        quic_retry on;

        location / {
            proxy_pass http://mold-web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # prevent iframing by foreign sites
            #add_header Content-Security-Policy "default-src https: -//-" always; # for production, requires https
            add_header Content-Security-Policy "default-src * 'unsafe-eval' 'unsafe-inline'; object-src 'none'; frame-ancestors 'self'" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            # prevent guessing mime-type by browser for stylesheets and scripts
            add_header X-Content-Type-Options nosniff always;
            # Only send the shortened referrer to a foreign origin, full referrer to a local host
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            # Control permissions for features available to scripts
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(self), fullscreen=(self), idle-detection=(self), publickey-credentials-get=(self), web-share=(self)";
        }
    }
}
